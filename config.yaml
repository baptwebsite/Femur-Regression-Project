train:
  gpu: "0"
  batch_size: 16
  epoch: 200
  learning_rate: 0.001
  optimizer: "Adam" 
  log_dir: "pointnet2_femur_exp"
  
dataset:
  root: "data"
  num_point: 2048
  sampling_method: "random" # 'random' ou 'fps'
  augment: true             # true pour inclure les données augmentées, false sinon

model:
  normal_channel: false
  sa1:
    npoint: 1024               
    radii: [0.03, 0.06, 0.12] 
    nsample: [16, 32, 64]      
    mlp: [[32, 32, 64], [64, 64, 128], [64, 96, 128]]
  sa2:
    npoint: 256               
    radii: [0.12, 0.24, 0.48]  
    nsample: [32, 64, 128]
    mlp: [[64, 64, 128], [128, 128, 256], [128, 128, 256]]
  sa3:
    mlp: [256, 512, 1024]     

