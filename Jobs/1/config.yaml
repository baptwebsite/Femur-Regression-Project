model:
  dropout:
  - 0.4
  - 0.5
  name: pointnet2_reg
  normal_channel: false
  num_point: 1024
  sa_config:
    mlps:
      layer1:
      - - 32
        - 32
        - 64
      - - 64
        - 64
        - 128
      - - 64
        - 96
        - 128
      layer2:
      - - 64
        - 64
        - 128
      - - 128
        - 128
        - 256
      - - 128
        - 128
        - 256
    npoints:
    - 512
    - 128
    radii:
      layer1:
      - 10.0
      - 20.0
      - 40.0
      layer2:
      - 20.0
      - 40.0
      - 80.0
training:
  batch_size: 16
  epoch: 1000
  learning_rate: 0.001
  optimizer: Adam
  process_data: true
  use_cpu: false
